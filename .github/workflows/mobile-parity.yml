name: Mobile specification and translations

on:
  push:
    branches: [main]
    paths:
      - 'international-patient-summary-app-*/**'
      - '.github/workflows/mobile-parity.yml'
  pull_request:
    paths:
      - 'international-patient-summary-app-*/**'
      - '.github/workflows/mobile-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare shared mobile requirements
        run: |
          for section in purpose scope documents screens sharing-and-privacy accessibility-and-language fixtures; do
            diff -u "international-patient-summary-app-with-swift/spec/$section.md" "international-patient-summary-app-with-kotlin/spec/$section.md"
          done
      - name: Verify generated translations match the shared source
        run: |
          python3 international-patient-summary-app-translations/translations.py generate
          generated=(
            international-patient-summary-app-with-swift/App/{Localizable,InfoPlist}.xcstrings
            international-patient-summary-app-with-swift/IPSApp.xcodeproj/project.pbxproj
            international-patient-summary-app-with-kotlin/app/src/main/res/values-*/strings.xml
          )
          changes=$(git status --porcelain -- "${generated[@]}")
          if [[ -n "$changes" ]]; then
            echo "$changes"
            echo "::error::Regenerate and commit the mobile translation resources."
            exit 1
          fi
