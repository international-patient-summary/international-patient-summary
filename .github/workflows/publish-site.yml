name: Publish site

# Pushes international-patient-summary.github.io/ to the site's own repository
# (international-patient-summary/international-patient-summary.github.io),
# whose own workflow then lints, builds, and deploys GitHub Pages. This is
# bin/publish run from CI, so the site folder is the only thing published.
#
# Fails, rather than forcing, if the site repository has commits this
# repository's subtree lacks (a non-fast-forward push). Resolve that by hand.
#
# One-time setup:
#   1. ssh-keygen -t ed25519 -N "" -f site-deploy-key
#   2. Site repository -> Settings -> Deploy keys -> add site-deploy-key.pub,
#      with "Allow write access" checked.
#   3. This repository -> Settings -> Secrets and variables -> Actions ->
#      new secret SITE_DEPLOY_KEY containing the private key file.

on:
  push:
    branches: [main]
    paths:
      - 'international-patient-summary.github.io/**'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:

# One publish at a time; let a running one finish rather than cancelling it.
concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # subtree split needs the full history

      - name: Publish site subtree
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          test -n "$SITE_DEPLOY_KEY" || { echo "::error::Secret SITE_DEPLOY_KEY is not set (see the comment at the top of this file)"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/site_deploy_key
          chmod 600 ~/.ssh/site_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/site_deploy_key -o IdentitiesOnly=yes"
          bin/publish
