name: Service check

# The service's CI (international-patient-summary-service-with-axum, tasks.md
# P1-T8): format, lint, every test against Postgres, and the MSRV build.

on:
  push:
    branches: [main]
    paths:
      - 'international-patient-summary-service-with-axum/**'
      - '.github/workflows/service-check.yml'
  pull_request:
    paths:
      - 'international-patient-summary-service-with-axum/**'
      - '.github/workflows/service-check.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: international-patient-summary-service-with-axum

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ips
          POSTGRES_PASSWORD: ips
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AXA_TEST_DB_URL: postgres://ips:ips@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --locked --profile ci --run-ignored all

  msrv:
    # rust-version in Cargo.toml: stable minus two. Change both together.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
      - run: cargo build --locked --all-targets
