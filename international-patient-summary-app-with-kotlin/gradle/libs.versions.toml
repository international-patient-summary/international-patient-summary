# Every version here was published at least two days before it was adopted
# (AGENTS.md, supply chain). Check the .pom Last-Modified before a bump.
[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
kotlinxSerialization = "1.13.0"
junit = "4.13.2"
# Test only: drives AppViewModel's coroutines. Same version as the kotlinx-coroutines-core that Compose and lifecycle already bring (1.9.0).
kotlinxCoroutines = "1.9.0"
# Test only (JVM tests of the Android code, P13-T3): published 2026-11-18.
robolectric = "4.18.1"
androidxTestCore = "1.7.0"
# Instrumented tests only (P1-T13): published 2025-07-30.
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# ui-test-junit4 brings espresso-core 3.5.0, which fails on API 36+ (InputManager.getInstance).
espressoCore = "3.7.0"

[libraries]
# Lily Design System, from a local checkout through a composite build (settings.gradle.kts); no version.
lily-core = { module = "io.github.lilydesignsystem:lily-core" }
lily-compose = { module = "io.github.lilydesignsystem:lily-compose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
