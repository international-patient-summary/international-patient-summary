# CI (tasks.md P1-T9). Runs when this folder is its own repository.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: IPSKit unit tests
        working-directory: IPSKit
        run: swift test
      - name: App UI tests on a simulator
        run: |
          xcodebuild test -project IPSApp.xcodeproj -scheme IPSApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO
