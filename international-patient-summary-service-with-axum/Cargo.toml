[package]
name = "international-patient-summary-service-with-axum"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Backend service that stores and serves HL7 FHIR International Patient Summary documents."
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
publish = false

[lib]
name = "ips_service"
path = "src/lib.rs"

[[bin]]
name = "international-patient-summary-service-with-axum"
path = "src/main.rs"

[dependencies]
axa = { version = "0.13", features = ["postgres-sqlx"] }
axum = "0.8"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "uuid", "json", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axa-test = { version = "0.4", features = ["postgres-sqlx"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
