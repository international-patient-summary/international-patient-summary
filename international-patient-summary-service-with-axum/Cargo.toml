[package]
name = "international-patient-summary-service-with-axum"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Backend service that stores and serves HL7 FHIR International Patient Summary documents."
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-NC-SA-4.0"
publish = false

[lib]
name = "ips_service"
path = "src/lib.rs"

[[bin]]
name = "international-patient-summary-service-with-axum"
path = "src/main.rs"

[dependencies]
axa = { version = "0.21", features = ["postgres-sqlx", "keycloak", "paseto"] }
authentication-verifier = { version = "0.9", default-features = false, features = ["paseto"] }
axum = "0.8"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "uuid", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axa-test = { version = "0.10", features = ["postgres-sqlx", "paseto"] }
# A local OIDC provider for the Keycloak tests; never in a release build.
authentication-verifier = { version = "0.9", default-features = false, features = ["paseto", "test-idp"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Checked arithmetic (spec/rust-checked-arithmetic, RCA-ENF-1). `unwrap_or`, `unwrap_or_else`, `map_or` and
# `map_or_else` stay allowed: they recover at the source with a declared fallback (RCA-NONE-2).
arithmetic_side_effects = "deny"
integer_division = "deny"
modulo_arithmetic = "deny"
default_numeric_fallback = "deny"
as_conversions = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Release builds keep overflow checks: a missed operator panics, which is detectable, instead of wrapping (RCA-ENF-4).
[profile.release]
overflow-checks = true

# Faster dev/test builds: keep line tables for backtraces, drop the rest of the debug info.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false
