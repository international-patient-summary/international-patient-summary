# Local Postgres for development and tests: `podman compose up -d` or `docker compose up -d`.
services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: ips
      POSTGRES_PASSWORD: ips
      POSTGRES_DB: international_patient_summary_service_development
    ports:
      - "127.0.0.1:5432:5432"
