  paperA4: A4
  paperLetter: US Letter
  download: Download
  downloadAnyway: Download the PDF anyway
  generating: Making the file…
  downloaded: 'Downloaded {$filename}'
  failed: The file could not be made.
  overflowWarning: The must-show content (identity, alerts, allergies, active medicines) does not fit on one page. The PDF runs to more than one page, and says so on every page.
  yamlComment: 'YAML form of an HL7 FHIR Bundle, exported by the International Patient Summary viewer. YAML is not an official FHIR format; it maps one to one to FHIR JSON.'

