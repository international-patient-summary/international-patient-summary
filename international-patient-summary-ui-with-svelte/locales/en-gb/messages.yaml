# International Patient Summary UI — English (United Kingdom), en-GB.
# British spelling; keys mirror en-us (the source of truth, spec §4.3).
# Every value is a Unicode MessageFormat 2 (MF2) message.
# Clinical content is never translated: these are interface words only.

app:
  title: International Patient Summary viewer
  shortTitle: IPS viewer
  tagline: View an HL7 FHIR International Patient Summary in your browser. Nothing leaves your device.

skipLink: Skip to main content

header:
  label: Site header
  home: Home
  examples: Examples

picker:
  links: Pages
  theme: Theme
  locale: Language
  textSize: Text size
  share: Share this app
  shareEmail: Email
  copyLink: Copy link to this app
  copied: Link copied
  copyFailed: Could not copy the link

footer:
  label: Site footer
  notMedicalDevice: This is a viewing tool, not a medical device. Check clinical decisions against the source record.
  privacy: Documents are read and exported in your browser only. Nothing is uploaded, stored, or shared.
  standards: 'Supports HL7 FHIR International Patient Summary {$version} (FHIR R4). Built with the Lily Design System.'

nav:
  pages: Pages

loader:
  heading: Open a patient summary
  intro: Choose a file, paste a document, enter a web address, or try an example. JSON and YAML are both accepted.
  tabsLabel: Ways to open a patient summary
  tabFile: File
  tabPaste: Paste
  tabUrl: Web address
  tabExamples: Examples
  fileLabel: Choose a file
  fileHint: A FHIR Bundle in JSON (.json) or YAML (.yaml, .yml), up to 10 MB.
  dropHint: Or drop a file anywhere on this page.
  dropActive: Drop the file to open it
  fileSelected: |-
    .input {$count :number}
    .match $count
    0   {{No file chosen}}
    one {{{$count} file chosen}}
    *   {{{$count} files chosen}}
  pasteLabel: Paste a FHIR Bundle (JSON or YAML)
  pasteButton: Open pasted document
  urlLabel: Web address of a FHIR Bundle
  urlHint: The address must start with https://. The server must allow browser access (CORS); if it does not, download the file and open it instead.
  urlButton: Fetch and open
  examplesIntro: Example documents from the HL7 FHIR IPS Implementation Guide 2.0.1.
  openExample: 'Open {$name}'
  loading: Opening the document…
  loadedAs: '{$format} document loaded from {$source}.'
  sourceText: pasted text
  errorTitle: There is a problem
  errorPosition: 'Line {$line}, column {$column}.'
  errorDetail: 'Details: {$detail}'

load:
  errors:
    tooLarge: 'The document is too large ({$size} bytes). The limit is {$max} bytes.'
    empty: The document is empty.
    invalidJson: The document is not valid JSON.
    invalidYaml: The document is not valid YAML.
    notJsonOrYaml: The document is neither valid JSON nor valid YAML.
    yamlMultiDocument: 'The YAML holds {$count} documents. Open one document at a time.'
    yamlNonFinite: 'The YAML has a value FHIR cannot hold (infinity or not-a-number) at {$path}.'
    yamlUnsupportedType: 'The YAML has a value FHIR JSON cannot hold at {$path}.'
    yamlDuplicateKey: The YAML repeats a key in the same object.
    yamlCustomTag: The YAML uses a tag. FHIR YAML must be plain data with no tags.
    yamlAliasLimit: 'The YAML uses too many aliases (more than {$max}).'
    urlInvalid: That is not a web address.
    urlNotHttps: Only secure web addresses (https://) can be opened.
    urlNetwork: 'Could not fetch the document from {$host}. The server may not allow browser access (CORS), or the network may be down. Try downloading the file and opening it instead.'
    urlStatus: 'The server answered with HTTP status {$status}.'

checks:
  heading: Document checks
  summary: |-
    .input {$count :number}
    .match $count
    0   {{Document checks: none}}
    one {{Document checks: {$count} finding}}
    *   {{Document checks: {$count} findings}}
  intro: The viewer reports problems it can see in the document's structure. It is not a validator; use the HL7 FHIR Validator to check conformance.
  severity:
    error: Error
    warning: Warning
    info: Information
  notFhir: This is not a FHIR resource.
  notBundle: 'This is a FHIR {$found}, not a Bundle. An International Patient Summary is a Bundle of type "document".'
  notDocument: 'This Bundle has type "{$found}". An International Patient Summary is a Bundle of type "document".'
  firstNotComposition: The first entry in the Bundle is not a Composition.
  noSubject: The Composition does not say who the patient is (no subject).
  subjectUnresolved: 'The patient ({$reference}) is not in the Bundle.'
  noIpsProfile: The document does not claim to follow the IPS profiles (no IPS meta.profile).
  unknownVersion: 'The document claims IPS version {$version}, which this viewer does not know.'
  notPatientSummaryType: 'The Composition type is LOINC {$code}, not 60591-5 "Patient summary Document".'
  unknownSection: 'A section with code {$code} is not an IPS section; it is shown as it is.'
  unresolvedReference: 'An entry ({$reference}) is not in the Bundle.'
  requiredSectionMissing: 'A required section (LOINC {$code}) is missing from the document.'
  blocking: This document cannot be shown.

