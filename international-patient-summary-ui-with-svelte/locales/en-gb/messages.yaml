format:
  periodRange: '{$start} to {$end}'
  periodFrom: 'From {$start}'
  periodUntil: 'Until {$end}'
  rangeBetween: '{$low} to {$high}'
  rangeAtLeast: 'At least {$low}'
  rangeAtMost: 'At most {$high}'
  frequency: '{$frequency} times every {$periodLabel}'
  asNeeded: as needed
  prescribedOn: 'Prescribed {$date}'
  onset: 'Since {$date}'
  abatement: 'Resolved {$date}'
  dose: 'Dose {$dose}'
  doseOf: 'Dose {$dose} of {$series}'
  usedSince: 'Start: {$date}'
  timeUnit:
    s: |-
      .input {$count :number}
      .match $count
      one {{{$count} second}}
      *   {{{$count} seconds}}
    min: |-
      .input {$count :number}
      .match $count
      one {{{$count} minute}}
      *   {{{$count} minutes}}
    h: |-
      .input {$count :number}
      .match $count
      one {{{$count} hour}}
      *   {{{$count} hours}}
    d: |-
      .input {$count :number}
      .match $count
      one {{{$count} day}}
      *   {{{$count} days}}
    wk: |-
      .input {$count :number}
      .match $count
      one {{{$count} week}}
      *   {{{$count} weeks}}
    mo: |-
      .input {$count :number}
      .match $count
      one {{{$count} month}}
      *   {{{$count} months}}
    a: |-
      .input {$count :number}
      .match $count
      one {{{$count} year}}
      *   {{{$count} years}}
  age:
    minutes: |-
      .input {$count :number}
      .match $count
      one {{{$count} minute}}
      *   {{{$count} minutes}}
    hours: |-
      .input {$count :number}
      .match $count
      one {{{$count} hour}}
      *   {{{$count} hours}}
    days: |-
