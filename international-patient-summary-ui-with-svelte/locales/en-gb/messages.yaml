examples:
  heading: Example documents
  intro: These are published examples from the HL7 FHIR International Patient Summary Implementation Guide 2.0.1. They describe fictional patients.
  open: Open
  bundle-minimal:
    name: Minimal
    description: The smallest valid summary — the three required sections only.
  bundle-no-info-required-sections:
    name: No information in required sections
    description: Required sections with no data, each stating why. Shows how "unavailable" differs from "none known".
  bundle-ips-all-sections:
    name: All sections
    description: Every section the IPS defines, including Alerts and Patient story (new in 2.0).
  IPS-examples-Bundle-01:
    name: Example 1
    description: A typical summary with allergies, medicines, problems, results and a plan of care.
  IPS-examples-Bundle-with-immunization:
    name: Example with immunisations
    description: Example 1 with an immunisation history.

export:
  heading: Export
  intro: Download this summary. Files are made in your browser; nothing is uploaded.
  formatLabel: Format
  json: JSON
  jsonDescription: The FHIR Bundle exactly as loaded.
  yaml: YAML
  yamlDescription: The same Bundle as YAML. YAML is not an official FHIR format.
  markdown: Markdown
  markdownDescription: A readable clinical summary, every section included.
  pdf: PDF (one page)
  pdfDescription: A one-page clinical summary for handing over or printing.
  options: Options
  includeNarrative: Include each section's narrative (as plain text)
  includeCodes: Include codes
  paperSize: Paper size
