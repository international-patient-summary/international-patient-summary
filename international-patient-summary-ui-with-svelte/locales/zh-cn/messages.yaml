# International Patient Summary UI — Simplified Chinese (mainland China), zh-CN.
# Keys follow locales/en-us/messages.yaml, the source of truth (spec §4.3).
# Every value is a Unicode MessageFormat 2 (MF2) message.
# Clinical content is never translated: these are interface words only.
# Machine-drafted; see REVIEW.md before release.

