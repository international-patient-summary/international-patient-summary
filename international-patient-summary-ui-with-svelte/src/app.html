<!doctype html>
<html lang="en-US" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="referrer" content="no-referrer" />
		<meta name="robots" content="noindex" />
		<link rel="icon" href="%sveltekit.assets%/assets/favicon.svg" type="image/svg+xml" />
		<!-- The default Lily theme. The theme picker appends its own stylesheet
		     after this one, so a saved choice wins. -->
		<link rel="stylesheet" href="%sveltekit.assets%/assets/themes/light.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/assets/style.css" />
		<title>International Patient Summary viewer</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
